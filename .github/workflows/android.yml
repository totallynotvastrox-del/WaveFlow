name: Android APK

# Builds the unofficial Android port from the `android` branch and
# publishes the APK as the `android-latest` pre-release of this fork.

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # `debug` compiles much faster and is what the port is iterated on;
  # `release` is what gets installed.
  PROFILE: debug
  TAURI_APP_PATH: ${{ github.workspace }}/src-tauri/crates/app
  TAURI_FRONTEND_PATH: ${{ github.workspace }}
  CARGO_TERM_COLOR: never

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: Android NDK
        run: |
          ndk="$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ndk" || ndk="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Rust toolchain
        working-directory: src-tauri
        run: |
          rustup show
          rustup target add aarch64-linux-android
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-${{ env.PROFILE }}
          cache-on-failure: true

      - name: Frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Generate the Android project
        run: |
          bunx tauri android init --ci
          bunx tauri icon src-tauri/crates/app/icons/icon.png
          python3 src-tauri/crates/app/android/apply_overlay.py src-tauri/crates/app/gen/android
          echo "::group::AndroidManifest.xml"
          cat src-tauri/crates/app/gen/android/app/src/main/AndroidManifest.xml
          echo "::endgroup::"
          echo "::group::app/build.gradle.kts"
          cat src-tauri/crates/app/gen/android/app/build.gradle.kts
          echo "::endgroup::"
          echo "::group::generated sources"
          find src-tauri/crates/app/gen/android -name '*.kt' -o -name '*.pro' -o -name '*.properties' | grep -v /build/ | sort
          echo "::endgroup::"

      - name: Build
        run: |
          flag=""
          if [ "$PROFILE" = "debug" ]; then flag="--debug"; fi
          # arm64 is what gets installed; x86_64 is what the emulator
          # below runs, so the same build is the one that is tested.
          bunx tauri android build --apk --split-per-abi --target aarch64 --target x86_64 --ci $flag

      - name: Sign
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          find src-tauri/crates/app/gen/android/app/build/outputs/apk -name '*.apk'
          for abi in arm64 x86_64; do
            apk="$(find src-tauri/crates/app/gen/android/app/build/outputs/apk -name "*${abi}*.apk" | head -1)"
            test -n "$apk"
            "$tools/zipalign" -f -p 4 "$apk" aligned.apk
            "$tools/apksigner" sign \
              --ks src-tauri/crates/app/android/sideload.keystore \
              --ks-key-alias waveflow \
              --ks-pass pass:waveflow-sideload \
              --out "WaveFlow-android-${abi}.apk" aligned.apk
          done
          "$tools/apksigner" verify --print-certs WaveFlow-android-arm64.apk | head -3
          "$tools/aapt2" dump badging WaveFlow-android-arm64.apk | head -12
          ls -la WaveFlow-android-*.apk
          unzip -l WaveFlow-android-arm64.apk | grep -E '\.so$' || true

      - uses: actions/upload-artifact@v4
        with:
          name: WaveFlow-android-arm64-${{ env.PROFILE }}
          path: WaveFlow-android-arm64.apk

      - name: Test tracks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p testmusic
          n=0
          for album in "First Light" "Second Wind"; do
            for t in 1 2 3; do
              n=$((n+1))
              ffmpeg -loglevel error -f lavfi -i "sine=frequency=$((220+n*55)):duration=40" \
                -metadata title="Smoke Track $n" -metadata artist="The Testers" \
                -metadata album="$album" -metadata track="$t" -metadata date="2024" -metadata genre="Test" \
                "testmusic/$(printf '%02d' $n) - Smoke Track $n.flac"
            done
          done
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=660:duration=40" -b:a 192k \
            -metadata title="Lossy Seven" -metadata artist="Another Artist" -metadata album="Singles" \
            "testmusic/07 - Lossy Seven.mp3"
          ls -la testmusic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a phone emulator
        id: phone
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/android/smoke.sh WaveFlow-android-x86_64.apk scripts/android/smoke-phone.steps smoke/phone

      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d smoke || exit 0
          mkdir pub && cd pub
          git init -q -b android-smoke
          cp -r ../smoke/. .
          find . -name logcat.txt -delete
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "smoke: ${GITHUB_SHA::7} ($PROFILE)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-smoke

      - name: Smoke test verdict
        if: steps.phone.outcome == 'failure'
        run: |
          echo "the emulator run failed; see its log and the android-smoke branch"
          exit 1

      - name: Publish as the android-latest pre-release
        if: env.PROFILE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest WaveFlow-android-arm64.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "WaveFlow for Android (unofficial port)" \
            --notes "Unofficial Android port of WaveFlow ${GITHUB_SHA::7}, built from the android branch of this fork. 64-bit ARM devices, Android 8.0 or later. Not affiliated with the WaveFlow project."
